services:
  postgres:
    image: postgres:16
    container_name: eu-stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-analytics}
      POSTGRES_USER: ${DB_USERNAME:-eu-stats}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eu-stats}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data